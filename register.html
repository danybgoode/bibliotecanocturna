<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Biblioteca Nocturna</title>
  <link rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.0.2/firebase-ui-auth.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/ui/6.0.2/firebase-ui-auth.js"></script>

  <style>
    body {
      background-color: #0d0d0d;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding-top: 50px;
    }
    #firebaseui-auth-container {
      display: inline-block;
      background: #1a1a1a;
      padding: 30px;
      border-radius: 10px;
      margin-bottom: 30px;
    }
    form {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
      width: 300px;
      text-align: left;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    #errorMsg {
      color: red;
      font-size: 0.9em;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Create Your Account</h1>

  <!-- Google Sign-In via FirebaseUI -->
  <div id="firebaseui-auth-container"></div>

  <p>Or use your email:</p>

  <!-- Custom Email Signup Form -->
  <form id="customSignupForm">
    <input type="email" id="email" required placeholder="Email">
    <input type="password" id="password" required placeholder="Password">
    <button type="submit">Sign Up</button>
    <div id="errorMsg"></div>
  </form>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDwsCEXZ61tO3l8L3NQHAP9IgI07nRTNmA",
      authDomain: "bibliotecanocturnaauth.firebaseapp.com",
      projectId: "bibliotecanocturnaauth",
      storageBucket: "bibliotecanocturnaauth.appspot.com",
      messagingSenderId: "627241133847",
      appId: "1:627241133847:web:27f2b56650fe72457f7952",
      measurementId: "G-9NPSSS6GDP"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const ui = new firebaseui.auth.AuthUI(auth);

    ui.start('#firebaseui-auth-container', {
      signInFlow: 'popup',
      signInOptions: [
        firebase.auth.GoogleAuthProvider.PROVIDER_ID
      ],
      callbacks: {
        signInSuccessWithAuthResult: async function(authResult, redirectUrl) {
          const user = authResult.user;
          const email = user.email;
          const uid = user.uid;

          try {
            await fetch("https://api.bibliotecanocturna.com.mx/api/signup", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email: email,
                password: uid,
                plan: "freemium"
              })
            });

            window.location.href = "/success.html";
            return false;
          } catch (error) {
            console.error("Signup error:", error);
            alert("There was an error completing your registration. Please try again.");
            return false;
          }
        }
      }
    });

    // Custom form for manual email/password registration
    const form = document.getElementById("customSignupForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("https://api.bibliotecanocturna.com.mx/api/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: email,
            password: password,
            plan: "freemium"
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || "Error creating account.");
        }

        window.location.href = "/success.html";
      } catch (error) {
        console.error("Custom form signup error:", error);
        errorMsg.textContent = error.message;
      }
    });
  </script>
</body>
</html>
