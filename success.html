<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white font-sans flex flex-col justify-center items-center h-screen text-center">
  <h1 class="text-2xl font-bold mb-2">¡Bienvenido a la Biblioteca Nocturna!</h1>
  <p class="mb-2">Tu cuenta ha sido creada exitosamente.</p>
  <p class="mb-4">Serás redirigido a tu biblioteca en unos segundos…</p>
  <div id="countdown" class="text-2xl text-gray-400">3</div>

  <script>
    let seconds = 3;
    const countdownEl = document.getElementById("countdown");
    const interval = setInterval(() => {
      seconds--;
      countdownEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = "https://listen.bibliotecanocturna.com.mx/login";
      }
    }, 1000);
  </script>
</body>
</html>
