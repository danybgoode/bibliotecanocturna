<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – Biblioteca Nocturna</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="container">
    <h2>Sign Up</h2>

    <div id="form-step">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <select id="plan">
        <option value="freemium">Freemium</option>
        <option value="premium">Premium</option>
      </select>
      <button onclick="showConfirmation()">Next</button>
    </div>

    <div id="confirm-step" style="display: none;">
      <p>Please confirm your info:</p>
      <ul id="confirm-details"></ul>
      <button onclick="submitSignup()">Confirm & Submit</button>
      <button onclick="goBack()">Cancel</button>
    </div>

    <div class="message" id="message"></div>

    <a class="link-btn" href="https://listen.bibliotecanocturna.com.mx/login" target="_blank">
      🔐 Already have an account? Log in here
    </a>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
